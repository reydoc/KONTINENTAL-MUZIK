{% extends 'base.html' %}

{% block title %}Upload Music | Wave-Distro{% endblock %}

{% block content %}

<section class="music-section">

    <div class="music-form-card">

        <p class="gold-text">NEW MUSIC RELEASE</p>

        <h1>Upload Your Music</h1>

        <p class="music-description">
            Add your release information and cover artwork.
        </p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="primary-btn">
                Create Release
            </button>

        </form>

    </div>

</section>

{% endblock %}
