
{% extends 'base.html' %}

{% block title %}Artist Registration | Wave-Distro{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <p class="gold-text">JOIN WAVE-DISTRO</p>

        <h1>Create Your Artist Account</h1>

        <p class="auth-description">
            Start your music distribution journey with us.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="primary-btn auth-submit">
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{% url 'login' %}">Login here</a>
        </p>

    </div>

</section>

{% endblock %}
